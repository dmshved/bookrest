services:
  database:
    image: postgres:latest
    container_name: bookrest.database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookrestdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookrestdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
